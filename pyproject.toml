[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fawkes-three-model-suite"
version = "0.1.0"
description = "Self-contained Graph-JEPA v5, Graph-JEPA v6, and paper-v16 implementations"
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.25",
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "torch>=2.4",
  "torch-geometric>=2.6",
  "tqdm>=4.66",
  "transformers>=4.44",
]

[project.optional-dependencies]
bge = ["FlagEmbedding>=1.3"]
tracking = ["wandb>=0.17"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "old_src"]   # old_src removed in Phase 8
addopts = "-q"
